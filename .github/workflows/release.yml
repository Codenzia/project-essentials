name: release

# Tag-triggered release. Force-pushes commit + tag from this -dev repo to
# the public mirror Codenzia/project-essentials, then creates a GitHub
# Release on the public repo. Packagist auto-detects the new tag via its
# webhook.
#
# Cut a release by tagging on main:
#   git tag -a v0.2.0 -m "Release v0.2.0"
#   git push origin v0.2.0

on:
  push:
    tags: ['v*']

jobs:
  release:
    uses: Codenzia/plugin-runtime/.github/workflows/plugin-release.yml@main
    with:
      public_repo: Codenzia/project-essentials
    secrets: inherit
